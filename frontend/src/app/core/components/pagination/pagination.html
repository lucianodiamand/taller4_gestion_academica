<div class="pagination">
  <button
    class="btn btn-secondary"
    type="button"
    [disabled]="pagina() === 0"
    (click)="paginaCambiada.emit(pagina() - 1)"
  >
    ← Anterior
  </button>

  <span class="pagination-pagina">Página {{ pagina() + 1 }} de {{ totalPaginas() }}</span>

  <button
    class="btn btn-secondary"
    type="button"
    [disabled]="pagina() >= totalPaginas() - 1"
    (click)="paginaCambiada.emit(pagina() + 1)"
  >
    Siguiente →
  </button>
</div>
